<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - QR FARM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Header -->
  <header class="bg-success d-flex justify-content-between align-items-center p-3 text-white">
    <a href="index.html" class="btn btn-dark">
      <i class="fas fa-home"></i> Inicio
    </a>
    <h1 class="m-0">QR FARM <i class="fas fa-tractor"></i></h1>
    <i class="fas fa-cow fa-2x"></i>
  </header>

  <!-- Cuerpo -->
  <main class="container my-5 d-flex flex-column flex-md-row justify-content-around align-items-center">
    
    <!-- Imagen + Texto -->
    <div class="text-center mb-4 mb-md-0">
      <img src="imagenes/fondo.jpg" alt="vaca pastando" class="img-fluid rounded-4" style="max-width: 400px;">
      <p class="mt-3">Tu aliado inteligente en la gestión ganadera.<br>
        Simplifica el control de tu ganado, mejora la trazabilidad<br>
        y optimiza tus procesos con tecnología QR.<br>
        ¡Transforma tu finca hoy!</p>
    </div>

    <!-- Formulario -->
    <div class="p-4 rounded-4" style="background-color: #666; color: white; min-width: 300px;">
      <h4><i class="fas fa-user me-2"></i>Inicio de Sesión</h4>
      <br>
      <form>
        <div class="mb-3">
          <label for="user" class="form-label">Usuario</label>
          <input type="text" id="user" class="form-control" placeholder="Ingresa tu usuario">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña">
        </div>
        <button type="submit" class="btn btn-success w-100 mb-2">Iniciar Sesión</button>
        <div class="text-center">
          <p class="mb-1">¿Has olvidado la contraseña?</p>
          <a href="crear_cuenta.html" class="btn btn-primary btn-sm">Crear una Cuenta</a>
        </div>
      </form>
    </div>

  </main>

</body>
</html>
