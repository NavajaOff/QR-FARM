<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - QR FARM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <!-- Header -->
    <header class="bg-success d-flex justify-content-between align-items-center p-3 text-white">
        <a href="index.html" class="btn btn-dark">
            <i class="fas fa-home"></i> Inicio
        </a>
        <h1 class="m-0">QR FARM <i class="fas fa-qrcode"></i></h1>
        <i class="fas fa-cow fa-2x"></i>
    </header>

    <!-- Registro -->
    <section class="d-flex justify-content-center align-items-center p-4 flex-wrap">
        <!-- Imagen -->
        <div class="p-3">
            <img src="imagenes/fondo.jpg" alt="Registro QR Farm" class="img-fluid rounded"
                style="max-height: 500px; border: 5px solid #007bff;">
        </div>

        <!-- Formulario -->
        <div class="bg-secondary text-white p-4 rounded" style="max-width: 600px;">
            <h2 class="text-center">Crear una cuenta</h2>
            <p class="text-center">Es rápido y fácil</p>
            <form>
                <div class="row g-2">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Primer Nombre">
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Segundo Nombre">
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Primer Apellido">
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Segundo Apellido">
                    </div>
                    <div class="col-md-6">
                        <input type="date" class="form-control" placeholder="Fecha de Nacimiento">
                    </div>
                    <div class="col-md-6">
                        <select class="form-select">
                            <option selected>Seleccionar Género</option>
                            <option>Masculino</option>
                            <option>Femenino</option>
                            <option>Otro</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <select class="form-select">
                            <option selected>Tipo de Documento</option>
                            <option>CC</option>
                            <option>TI</option>
                            <option>CE</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Número de Documento">
                    </div>
                    <div class="col-md-6">
                        <input type="tel" class="form-control" placeholder="Número de móvil">
                    </div>
                    <div class="col-md-6">
                        <input type="email" class="form-control" placeholder="Correo electrónico">
                    </div>
                    <div class="col-12">
                        <input type="password" class="form-control" placeholder="Contraseña nueva">
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success w-100">Crear Cuenta</button>
                </div>
            </form>
        </div>
    </section>
    <script>
        document.getElementById('form-registro').addEventListener('submit', function (e) {
            e.preventDefault(); // Evita el envío real

            Swal.fire({
                icon: 'success',
                title: '¡Cuenta creada!',
                text: 'Tu cuenta fue registrada correctamente.',
                confirmButtonText: 'Continuar',
                timer: 2000,
                timerProgressBar: true
            }).then(() => {
                // Redirige a tu dashboard o página principal
                window.location.href = 'dashboard.html'; // cambia esto por el nombre real del archivo
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
