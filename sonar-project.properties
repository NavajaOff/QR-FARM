# Proyecto

sonar.projectKey=qr-farm

sonar.projectName=QR-Farm

sonar.sourceEncoding=UTF-8

# Fuentes

sonar.sources=backend/src,frontend/src

sonar.tests=backend/tests,frontend/src

# Cobertura

sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Excluir HTML de Vitest

sonar.exclusions=frontend/coverage/lcov-report/**

# Incluir solo archivos de test específicos (wildcards permitidos aquí)

sonar.test.inclusions=**/test.py,**/spec.js,**/test.js

# Lenguajes

sonar.language=py,js

sonar.python.version=3.12
