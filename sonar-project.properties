# ============================================
# Configuración de SonarQube para QR-Farm
# ============================================

# Identificación del proyecto
sonar.projectKey=qr-farm
sonar.projectName=QR-Farm
sonar.sourceEncoding=UTF-8

# ============================================
# RUTAS DE CÓDIGO FUENTE
# ============================================
# Solo código fuente de producción (excluye tests automáticamente con sonar.exclusions)
sonar.sources=backend/src,frontend/src

# ============================================
# RUTAS DE TESTS
# ============================================
# Backend: tests en carpeta separada backend/tests/
# Frontend: tests mezclados en frontend/src/, identificados con sonar.test.inclusions
sonar.tests=backend/tests,frontend/src

# ============================================
# REPORTES DE COBERTURA
# ============================================
# Python: reporte XML generado por pytest-cov
sonar.python.coverage.reportPaths=backend/coverage.xml

# JavaScript/TypeScript: reporte LCOV generado por Vitest
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ============================================
# EXCLUSIONES DEL ANÁLISIS DE CÓDIGO
# ============================================
# Excluir del análisis de código fuente:
# - Reportes HTML de cobertura
# - Archivos de test (*.spec.*, *.test.*)
# - Helpers de test
# - Archivos de configuración de tests
sonar.exclusions=\
  frontend/coverage/lcov-report/**,\
  **/*.spec.{js,ts,jsx,tsx},\
  **/*.test.{js,ts,jsx,tsx},\
  **/test-helpers.*,\
  **/test-setup.*,\
  **/__tests__/**,\
  **/__mocks__/**

# ============================================
# INCLUSIONES DE ARCHIVOS DE TEST
# ============================================
# Identificar archivos de test dentro de sonar.tests
# Estos archivos se analizan como tests, no como código fuente
sonar.test.inclusions=\
  **/*test*.py,\
  **/*spec*.{js,ts,jsx,tsx},\
  **/*test*.{js,ts,jsx,tsx}

# ============================================
# EXCLUSIONES DE COBERTURA
# ============================================
# Archivos que NO deben contar para cobertura:
# - Todos los archivos de test
# - Helpers y mocks de test
# - Archivos de configuración de tests
# IMPORTANTE: Estos archivos están excluidos de la medición de cobertura
sonar.coverage.exclusions=\
  **/*.spec.{js,ts,jsx,tsx},\
  **/*.test.{js,ts,jsx,tsx},\
  **/test-helpers.*,\
  **/test-setup.*,\
  **/*test*.py,\
  **/__tests__/**,\
  **/__mocks__/**

# ============================================
# CONFIGURACIÓN DE LENGUAJES
# ============================================
sonar.language=py,js
sonar.python.version=3.12

# ============================================
# NOTAS IMPORTANTES
# ============================================
# 1. sonar.sources: Solo código fuente de producción
# 2. sonar.tests: Ubicación de archivos de test (pueden estar mezclados con código fuente)
# 3. sonar.exclusions: Excluye archivos del análisis de código fuente
# 4. sonar.test.inclusions: Identifica qué archivos dentro de sonar.tests son tests
# 5. sonar.coverage.exclusions: Excluye archivos de la medición de cobertura
#
# La configuración asegura que:
# - Los archivos de test NO se analicen como código fuente
# - Los archivos de test NO cuenten para cobertura
# - Solo el código fuente real se mida en cobertura
