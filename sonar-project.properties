# Proyecto
sonar.projectKey=qr-farm
sonar.projectName=QR-Farm
sonar.sourceEncoding=UTF-8

# Fuentes
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/**/*.spec.js

# Cobertura
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.coverage.reportPaths=frontend/coverage/cobertura-coverage.xml

# Excluir HTML de Vitest
sonar.exclusions=frontend/coverage/lcov-report/**

# Lenguajes
sonar.language=py,js
sonar.python.version=3.14.0
