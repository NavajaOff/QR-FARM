# Proyecto

sonar.projectKey=qr-farm

sonar.projectName=QR-Farm

sonar.sourceEncoding=UTF-8

# Fuentes

sonar.sources=backend/src,frontend/src

sonar.tests=backend/tests,frontend/src

# Cobertura

sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Excluir HTML de Vitest y archivos de prueba del análisis de cobertura

sonar.exclusions=frontend/coverage/lcov-report/**,**/*.spec.{js,ts},**/*.test.{js,ts},**/test-helpers.*,**/test-setup.js

# Incluir solo archivos de test específicos (wildcards permitidos aquí)

sonar.test.inclusions=**/*test*.py,**/*spec*.js,**/*test*.js

# Excluir archivos de prueba del análisis de cobertura (no deben contar en coverage)

sonar.coverage.exclusions=**/*.spec.{js,ts},**/*.test.{js,ts},**/test-helpers.*,**/test-setup.js,**/*test*.py

# Lenguajes

sonar.language=py,js

sonar.python.version=3.12
