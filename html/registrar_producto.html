<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Animal - QR FARM</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <i class="fas fa-user-circle fa-lg me-2"></i>
                <span class="fw-bold">Usuario</span>
            </div>
            
            <a class="navbar-brand mx-auto d-flex align-items-center" href="menu.html">
                <span class="fw-bold fs-2">QR FARM</span>
                <i class="fas fa-cow ms-2 logo-icon"></i>
            </a>
            
            <div class="navbar-brand">
                <i class="fas fa-cow fa-2x"></i>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="inventario.html">
                    <i class="fas fa-boxes me-2"></i>Inventario
                </a>
                <a class="nav-link" href="gestionar_animales.html">
                    <i class="fas fa-cow me-2"></i>Gestionar animales
                </a>
                <a class="nav-link" href="gestionar_potreros.html">
                    <i class="fas fa-map-marked-alt me-2"></i>Gestionar potreros
                </a>
                <a class="nav-link" href="escanear_qr.html">
                    <i class="fas fa-qrcode me-2"></i>Escanear QR
                </a>
                <a class="nav-link active" href="registrar_producto.html">
                    <i class="fas fa-plus-circle me-2"></i>Registrar producto
                </a>
                <a class="nav-link" href="vender_producto.html">
                    <i class="fas fa-shopping-cart me-2"></i>Vender producto
                </a>
                <a class="nav-link" href="gestionar_clientes.html">
                    <i class="fas fa-users me-2"></i>Gestionar clientes
                </a>
                <a class="nav-link" href="#" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>Salir
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content" style="margin-left: 200px; padding: 20px;">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <h2 class="fw-bold text-dark mb-4">
                            <i class="fas fa-plus-circle me-2 text-success"></i>Registrar Nuevo Animal
                        </h2>
                        
                        <div class="card border-0 shadow">
                            <div class="card-body p-4">
                                <form id="registroAnimalForm">
                                    <!-- Información Básica -->
                                    <div class="row mb-4">
                                        <div class="col-12">
                                            <h5 class="text-success mb-3">
                                                <i class="fas fa-info-circle me-2"></i>Información Básica
                                            </h5>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Código/Nombre del Animal *</label>
                                            <input type="text" class="form-control" id="codigoAnimal" required placeholder="Ej: Holstein-004">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Raza *</label>
                                            <select class="form-select" id="raza" required>
                                                <option value="">Seleccionar raza</option>
                                                <option value="holstein">Holstein</option>
                                                <option value="angus">Angus</option>
                                                <option value="jersey">Jersey</option>
                                                <option value="brahman">Brahman</option>
                                                <option value="charolais">Charolais</option>
                                                <option value="simmental">Simmental</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Fecha de Nacimiento *</label>
                                            <input type="date" class="form-control" id="fechaNacimiento" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Sexo *</label>
                                            <select class="form-select" id="sexo" required>
                                                <option value="">Seleccionar sexo</option>
                                                <option value="macho">Macho</option>
                                                <option value="hembra">Hembra</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Información Física -->
                                    <div class="row mb-4">
                                        <div class="col-12">
                                            <h5 class="text-success mb-3">
                                                <i class="fas fa-weight me-2"></i>Información Física
                                            </h5>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Peso Actual (kg)</label>
                                            <input type="number" class="form-control" id="peso" placeholder="Ej: 450">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Altura (cm)</label>
                                            <input type="number" class="form-control" id="altura" placeholder="Ej: 140">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Color/Características</label>
                                            <input type="text" class="form-control" id="color" placeholder="Ej: Negro con blanco">
                                        </div>
                                    </div>

                                    <!-- Información de Ubicación -->
                                    <div class="row mb-4">
                                        <div class="col-12">
                                            <h5 class="text-success mb-3">
                                                <i class="fas fa-map-marker-alt me-2"></i>Ubicación y Manejo
                                            </h5>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Potrero Asignado *</label>
                                            <select class="form-select" id="potrero" required>
                                                <option value="">Seleccionar potrero</option>
                                                <option value="potrero1">Potrero 1</option>
                                                <option value="potrero2">Potrero 2</option>
                                                <option value="potrero3">Potrero 3</option>
                                                <option value="potrero4">Potrero 4</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Estado de Salud</label>
                                            <select class="form-select" id="estadoSalud">
                                                <option value="saludable">Saludable</option>
                                                <option value="tratamiento">En tratamiento</option>
                                                <option value="observacion">En observación</option>
                                                <option value="enfermo">Enfermo</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Información Genealógica -->
                                    <div class="row mb-4">
                                        <div class="col-12">
                                            <h5 class="text-success mb-3">
                                                <i class="fas fa-sitemap me-2"></i>Información Genealógica (Opcional)
                                            </h5>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Padre</label>
                                            <input type="text" class="form-control" id="padre" placeholder="Código del padre">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Madre</label>
                                            <input type="text" class="form-control" id="madre" placeholder="Código de la madre">
                                        </div>
                                    </div>

                                    <!-- Observaciones -->
                                    <div class="row mb-4">
                                        <div class="col-12">
                                            <h5 class="text-success mb-3">
                                                <i class="fas fa-sticky-note me-2"></i>Observaciones
                                            </h5>
                                            <textarea class="form-control" id="observaciones" rows="4" placeholder="Observaciones adicionales sobre el animal..."></textarea>
                                        </div>
                                    </div>

                                    <!-- Botones -->
                                    <div class="row">
                                        <div class="col-12">
                                            <div class="d-flex justify-content-between">
                                                <button type="button" class="btn btn-outline-secondary" onclick="limpiarFormulario()">
                                                    <i class="fas fa-eraser me-1"></i>Limpiar Formulario
                                                </button>
                                                <div>
                                                    <button type="button" class="btn btn-outline-primary me-2" onclick="previsualizarQR()">
                                                        <i class="fas fa-qrcode me-1"></i>Previsualizar QR
                                                    </button>
                                                    <button type="submit" class="btn btn-success">
                                                        <i class="fas fa-save me-1"></i>Registrar Animal
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registroAnimalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const codigo = document.getElementById('codigoAnimal').value;
            const raza = document.getElementById('raza').value;
            const fechaNacimiento = document.getElementById('fechaNacimiento').value;
            const sexo = document.getElementById('sexo').value;
            const potrero = document.getElementById('potrero').value;
            
            if (!codigo || !raza || !fechaNacimiento || !sexo || !potrero) {
                Swal.fire({
                    icon: 'error',
                    title: 'Campos requeridos',
                    text: 'Por favor completa todos los campos obligatorios (*)',
                    confirmButtonColor: '#dc3545'
                });
                return;
            }
            
            Swal.fire({
                title: 'Registrando animal...',
                html: '<i class="fas fa-spinner fa-spin"></i> Generando código QR y guardando información',
                showConfirmButton: false,
                timer: 3000
            }).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: '¡Animal registrado exitosamente!',
                    html: `
                        <div class="text-start">
                            <p><strong>Código:</strong> ${codigo}</p>
                            <p><strong>Raza:</strong> ${raza}</p>
                            <p><strong>Potrero asignado:</strong> ${potrero}</p>
                            <p class="text-success"><i class="fas fa-qrcode me-1"></i> Código QR generado automáticamente</p>
                        </div>
                    `,
                    confirmButtonColor: '#00d563',
                    confirmButtonText: 'Ver en Inventario'
                }).then(() => {
                    window.location.href = 'inventario.html';
                });
            });
        });

        function limpiarFormulario() {
            document.getElementById('registroAnimalForm').reset();
            Swal.fire({
                icon: 'info',
                title: 'Formulario limpiado',
                text: 'Todos los campos han sido borrados',
                timer: 1500,
                showConfirmButton: false
            });
        }

        function previsualizarQR() {
            const codigo = document.getElementById('codigoAnimal').value;
            if (!codigo) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Código requerido',
                    text: 'Ingresa el código del animal para generar el QR',
                    confirmButtonColor: '#ffc107'
                });
                return;
            }

            Swal.fire({
                title: 'Código QR Generado',
                html: `
                    <div class="text-center">
                        <div style="border: 2px solid #dee2e6; padding: 20px; border-radius: 10px; background: #f8f9fa;">
                            <i class="fas fa-qrcode fa-5x text-primary mb-3"></i>
                            <p><strong>Código:</strong> ${codigo}</p>
                            <p class="text-muted">Este será el código QR del animal</p>
                        </div>
                    </div>
                `,
                confirmButtonColor: '#00d563'
            });
        }

        function logout() {
            Swal.fire({
                title: '¿Cerrar sesión?',
                text: '¿Estás seguro de que quieres cerrar sesión?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, cerrar sesión',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#dc3545'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('nombreUsuario');
                    window.location.href = 'index.html';
                }
            });
        }

        // Verificar autenticación
        document.addEventListener('DOMContentLoaded', function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                window.location.href = 'iniciar_sesion.html';
            }
        });
    </script>
</body>
</html>
