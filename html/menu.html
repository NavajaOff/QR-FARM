<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal - QR FARM</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <i class="fas fa-user-circle fa-lg me-2"></i>
                <span class="fw-bold">Usuario</span>
            </div>
            
            <a class="navbar-brand mx-auto d-flex align-items-center" href="menu.html">
                <span class="fw-bold fs-2">QR FARM</span>
                <i class="fas fa-cow ms-2 logo-icon"></i>
            </a>
            
            <div class="navbar-brand">
                <i class="fas fa-cow fa-2x"></i>
            </div>
        </div>
    </nav>

    <!-- Notification Icon - Movido a la derecha -->
    <div class="notification-icon" style="position: fixed; top: 70px; right: 20px; z-index: 1000;">
        <button class="btn btn-light rounded-circle shadow" onclick="showNotifications()">
            <i class="fas fa-bell fa-lg"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                3
            </span>
        </button>
    </div>

    <!-- Main Layout -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <nav class="nav flex-column">
                <a class="nav-link active" href="#" onclick="setActiveMenu(this, 'inventario')">
                    <i class="fas fa-boxes me-2"></i>Inventario
                </a>
                <a class="nav-link" href="#" onclick="setActiveMenu(this, 'gestionar-animales')">
                    <i class="fas fa-cow me-2"></i>Gestionar animales
                </a>
                <a class="nav-link" href="#" onclick="setActiveMenu(this, 'gestionar-potreros')">
                    <i class="fas fa-map-marked-alt me-2"></i>Gestionar potreros
                </a>
                <a class="nav-link" href="#" onclick="setActiveMenu(this, 'escanear-qr')">
                    <i class="fas fa-qrcode me-2"></i>Escanear QR
                </a>
                <a class="nav-link" href="#" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>Salir
                </a>
            </nav>
        </div>

        <!-- Main Content - Cajita centrada considerando el sidebar -->
<div class="main-content d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 56px); margin-left: 200px;">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <!-- Título principal -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark mb-2">
                        ¡Bienvenido, <span id="nombreUsuario">Nombre del usuario</span>!
                    </h2>
                    <p class="lead text-muted">
                        Gestiona tu finca de manera inteligente con QR Farm
                    </p>
                </div>

                <!-- Cajita centrada con todo el contenido -->
                <div class="d-flex justify-content-center">
                    <div class="card border-0 shadow-lg" style="max-width: 700px; width: 90%;">
                        <div class="card-body p-4">
                            <!-- Imagen -->
                            <div class="text-center mb-4">
                                <img src="../images/vascas-holstein.jpg" alt="Vacas Holstein - QR Farm" class="img-fluid rounded-3 shadow" style="max-width: 100%; height: 250px; object-fit: cover;">
                            </div>

                            <!-- Estadísticas -->
                            <div class="row mb-4">
                                <div class="col-6 col-md-3 mb-3">
                                    <div class="text-center p-3 bg-light rounded-3">
                                        <i class="fas fa-cow fa-2x text-success mb-2"></i>
                                        <h5 class="fw-bold mb-1">125</h5>
                                        <small class="text-muted">Animales</small>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3 mb-3">
                                    <div class="text-center p-3 bg-light rounded-3">
                                        <i class="fas fa-qrcode fa-2x text-primary mb-2"></i>
                                        <h5 class="fw-bold mb-1">125</h5>
                                        <small class="text-muted">Códigos QR</small>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3 mb-3">
                                    <div class="text-center p-3 bg-light rounded-3">
                                        <i class="fas fa-chart-line fa-2x text-warning mb-2"></i>
                                        <h5 class="fw-bold mb-1">98%</h5>
                                        <small class="text-muted">Salud</small>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3 mb-3">
                                    <div class="text-center p-3 bg-light rounded-3">
                                        <i class="fas fa-dollar-sign fa-2x text-info mb-2"></i>
                                        <h5 class="fw-bold mb-1">$45K</h5>
                                        <small class="text-muted">Ingresos</small>
                                    </div>
                                </div>
                            </div>

                            <!-- Acciones Rápidas -->
                            <div class="text-center">
                                <h5 class="fw-bold mb-3 text-success">Acciones Rápidas</h5>
                                <div class="d-flex justify-content-center gap-2 flex-wrap">
                                    <button class="btn btn-success" onclick="activarEscanearQR()" style="min-width: 130px;">
                                        <i class="fas fa-qrcode me-1"></i>Escanear QR
                                    </button>
                                    <button class="btn btn-primary" onclick="activarRegistrarProducto()" style="min-width: 130px;">
                                        <i class="fas fa-plus-circle me-1"></i>Registrar Animal
                                    </button>
                                    <button class="btn btn-info" onclick="generateReport()" style="min-width: 130px;">
                                        <i class="fas fa-chart-bar me-1"></i>Ver Reportes
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Función para cambiar el menú activo
        function setActiveMenu(element, section) {
            // Remover clase active de todos los enlaces
            document.querySelectorAll('.sidebar .nav-link').forEach(link => {
                link.classList.remove('active');
            });
            
            // Agregar clase active al enlace clickeado
            element.classList.add('active');
            
            // Mostrar contenido según la sección
            showSectionContent(section);
        }

        // Función para mostrar contenido de cada sección
        function showSectionContent(section) {
    // Redirigir a las páginas correspondientes
    switch(section) {
        case 'inventario':
            window.location.href = 'inventario.html';
            break;
        case 'gestionar-animales':
            window.location.href = 'gestionar_animales.html';
            break;
        case 'gestionar-potreros':
            window.location.href = 'gestionar_potreros.html';
            break;
        case 'escanear-qr':
            window.location.href = 'escanear_qr.html';
            break;
        case 'registrar-producto':
            window.location.href = 'registrar_producto.html';
            break;
        case 'vender-producto':
            window.location.href = 'vender_producto.html';
            break;
        case 'gestionar-clientes':
            window.location.href = 'gestionar_clientes.html';
            break;
        default:
            Swal.fire({
                title: 'Sección',
                text: 'Funcionalidad en desarrollo',
                icon: 'info',
                confirmButtonColor: '#00d563'
            });
    }
}

        // Función para mostrar notificaciones
        function showNotifications() {
            Swal.fire({
                title: '<i class="fas fa-bell"></i> Notificaciones',
                html: `
                    <div class="text-start">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>Recordatorio:</strong> Vacunación programada para mañana
                        </div>
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <strong>Alerta:</strong> Animal #125 requiere atención médica
                        </div>
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            <strong>Completado:</strong> Registro de producción actualizado
                        </div>
                    </div>
                `,
                confirmButtonText: 'Marcar como leídas',
                confirmButtonColor: '#00d563',
                width: '600px'
            });
        }

        // Función para generar reportes
        function generateReport() {
            Swal.fire({
                title: '<i class="fas fa-chart-bar"></i> Generar Reporte',
                html: `
                    <div class="text-start">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Reporte:</label>
                            <select class="form-select" id="tipoReporte">
                                <option value="produccion">Reporte de Producción</option>
                                <option value="salud">Reporte de Salud</option>
                                <option value="inventario">Reporte de Inventario</option>
                                <option value="financiero">Reporte Financiero</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Período:</label>
                            <select class="form-select" id="periodo">
                                <option value="semana">Última semana</option>
                                <option value="mes">Último mes</option>
                                <option value="trimestre">Último trimestre</option>
                                <option value="año">Último año</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-download"></i> Generar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#00d563',
                preConfirm: () => {
                    const tipo = document.getElementById('tipoReporte').value;
                    const periodo = document.getElementById('periodo').value;
                    return { tipo, periodo };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Reporte generado',
                        text: `Reporte de ${result.value.tipo} para ${result.value.periodo} generado exitosamente`,
                        confirmButtonColor: '#00d563'
                    });
                }
            });
        }

        // Función para cerrar sesión
        function logout() {
            Swal.fire({
                title: '¿Cerrar sesión?',
                text: '¿Estás seguro de que quieres cerrar sesión?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, cerrar sesión',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Limpiar localStorage
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('nombreUsuario');
                    
                    Swal.fire({
                        title: 'Cerrando sesión...',
                        html: '<i class="fas fa-spinner fa-spin"></i> Hasta pronto',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                }
            });
        }

        // Inicializar página
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si está logueado
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                window.location.href = 'iniciar_sesion.html';
                return;
            }
            
            // Simular nombre de usuario (en una app real vendría del backend)
            const nombreUsuario = localStorage.getItem('nombreUsuario') || 'Usuario';
            document.getElementById('nombreUsuario').textContent = nombreUsuario;
            
            // Mostrar notificación de bienvenida
            setTimeout(() => {
                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });

                Toast.fire({
                    icon: 'success',
                    title: `¡Bienvenido de vuelta, ${nombreUsuario}!`
                });
            }, 1000);
        });

        // Funciones auxiliares para evitar problemas con comillas
        function activarEscanearQR() {
            const elemento = document.querySelector('a[onclick*="escanear-qr"]');
            setActiveMenu(elemento, 'escanear-qr');
        }

        function activarRegistrarProducto() {
            const elemento = document.querySelector('a[onclick*="registrar-producto"]');
            setActiveMenu(elemento, 'registrar-producto');
        }
    </script>
</body>
</html>
