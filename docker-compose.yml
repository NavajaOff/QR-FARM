# ============================================================================
# docker-compose.yml - Configuración optimizada para BuildKit
# ============================================================================
# Esta configuración usa BuildKit para builds paralelos y optimizados.
# BuildKit está habilitado por defecto en Docker Desktop y Docker Engine 20.10+
# ============================================================================
# Para usar BuildKit explícitamente:
# export DOCKER_BUILDKIT=1
# export COMPOSE_DOCKER_CLI_BUILD=1
# docker compose build
# ============================================================================
# NOTA: Las imágenes intermedias (<none>) de multi-stage builds son normales.
# BuildKit las genera para cachear stages intermedios y optimizar rebuilds.
# Se pueden limpiar con: docker image prune -f
# ============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: qr-farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: gestion_ganadera
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3313:3306"
    networks:
      - qr-farm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qr-farm-backend
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - sed -i 's/\r$$//' /entrypoint.sh && exec /entrypoint.sh
    env_file:
      - .env
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DEBUG: ${DEBUG:-False}
      RUN_SEEDERS: ${RUN_SEEDERS:-False}
      PORT: ${PORT:-5000}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-gestion_ganadera}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://localhost:5173,http://localhost:80,http://frontend,http://frontend:80}
    ports:
      - "${BACKEND_PORT:-5010}:${PORT:-5000}"
    volumes:
      - ./qr:/app/qr
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qr-farm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5010}
    container_name: qr-farm-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_BACKEND_URL:-http://localhost:5010}
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
    networks:
      - qr-farm-network

volumes:
  mysql_data:
    driver: local

networks:
  qr-farm-network:
    driver: bridge