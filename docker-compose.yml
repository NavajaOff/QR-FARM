version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qr-farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - qr-farm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qr-farm-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_POOL_SIZE=10
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRES=86400
      - ROOT_SUPER_ADMIN_EMAIL=${ROOT_SUPER_ADMIN_EMAIL}
      - ROOT_SUPER_ADMIN_PASSWORD=${ROOT_SUPER_ADMIN_PASSWORD}
      - ROOT_SUPER_ADMIN_NOMBRE=${ROOT_SUPER_ADMIN_NOMBRE}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./qr:/app/qr
    networks:
      - qr-farm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qr-farm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - qr-farm-network

volumes:
  mysql_data:
    driver: local

networks:
  qr-farm-network:
    driver: bridge