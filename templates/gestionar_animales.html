<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionar Animales - QR FARM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/gestionar_animales.js') }}"></script>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand mx-auto d-flex align-items-center" href="{{ url_for('menu') }}">
                <span class="fw-bold fs-2">QR FARM</span>
                <i class="fas fa-cow ms-2 logo-icon"></i>
            </a>
            <div class="navbar-brand">
                <i class="fas fa-cow fa-2x"></i>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <nav class="nav flex-column">
                <a class="nav-link{% if request.endpoint == 'inventario' %} active{% endif %}" href="{{ url_for('inventario') }}">
                    <i class="fas fa-boxes me-2"></i>Inventario
                </a>
                <a class="nav-link{% if request.endpoint == 'gestionar_animales' %} active{% endif %}" href="{{ url_for('gestionar_animales') }}">
                    <i class="fas fa-cow me-2"></i>Gestionar animales
                </a>
                <a class="nav-link{% if request.endpoint == 'gestionar_potreros' %} active{% endif %}" href="{{ url_for('gestionar_potreros') }}">
                    <i class="fas fa-map-marked-alt me-2"></i>Gestionar potreros
                </a>
                <a class="nav-link{% if request.endpoint == 'escanear_qr' %} active{% endif %}" href="{{ url_for('escanear_qr') }}">
                    <i class="fas fa-qrcode me-2"></i>Escanear QR
                </a>
                <a class="nav-link" href="{{ url_for('iniciar_sesion') }}">
                    <i class="fas fa-sign-out-alt me-2"></i>Salir
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="container-fluid py-4 py-md-5">
                <div class="row justify-content-center g-4">
                    <div class="col-12">
                        <!-- Título -->
                        <div class="mb-4">
                            <h2 class="fw-bold text-dark mb-2 mb-md-3">
                                <i class="fas fa-cow me-2 text-success"></i>Gestionar Animales
                            </h2>
                        </div>

                        <!-- Filtros -->
                        <div class="card border-0 shadow-lg mb-4">
                            <div class="card-body p-3 p-sm-4">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label">Buscar por código/nombre:</label>
                                        <input type="text" class="form-control" id="busquedaAnimal" placeholder="Buscar animal..." oninput="filtrarAnimales()">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Filtrar por raza:</label>
                                        <select class="form-select">
                                            <option>Todas las razas</option>
                                            <option>Holstein</option>
                                            <option>Angus</option>
                                            <option>Jersey</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Estado de salud:</label>
                                        <select class="form-select">
                                            <option>Todos los estados</option>
                                            <option>Saludable</option>
                                            <option>En tratamiento</option>
                                            <option>Enfermo</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2 d-flex align-items-end">
                                        <button class="btn btn-primary w-100">
                                            <i class="fas fa-search me-1"></i>Buscar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Grid de Animales -->
                        <div class="row g-4" id="gridAnimales">
                            <div class="col-12 col-sm-6 col-lg-4">
                                <div class="card border-0 shadow-sm h-100">
                                    <div class="card-body text-center">
                                        <i class="fas fa-cow fa-3x text-success mb-3"></i>
                                        <h5 class="card-title">Holstein-001</h5>
                                        <p class="text-muted">Raza: Holstein</p>
                                        <p class="text-muted">Edad: 3 años</p>
                                        <span class="badge bg-success mb-3">Saludable</span>
                                        <div class="d-grid gap-2">
                                            <button class="btn btn-outline-primary" onclick="verPerfilAnimal('Holstein-001')">
                                                <i class="fas fa-eye me-1"></i>Ver Perfil
                                            </button>
                                            <button class="btn btn-outline-warning" onclick="editarAnimal('Holstein-001')">
                                                <i class="fas fa-edit me-1"></i>Editar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-sm-6 col-lg-4">
                                <div class="card border-0 shadow-sm h-100">
                                    <div class="card-body text-center">
                                        <i class="fas fa-cow fa-3x text-warning mb-3"></i>
                                        <h5 class="card-title">Angus-002</h5>
                                        <p class="text-muted">Raza: Angus</p>
                                        <p class="text-muted">Edad: 2 años</p>
                                        <span class="badge bg-warning mb-3">En Tratamiento</span>
                                        <div class="d-grid gap-2">
                                            <button class="btn btn-outline-primary" onclick="verPerfilAnimal('Angus-002')">
                                                <i class="fas fa-eye me-1"></i>Ver Perfil
                                            </button>
                                            <button class="btn btn-outline-warning" onclick="editarAnimal('Angus-002')">
                                                <i class="fas fa-edit me-1"></i>Editar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-sm-6 col-lg-4">
                                <div class="card border-0 shadow-sm h-100">
                                    <div class="card-body text-center">
                                        <i class="fas fa-cow fa-3x text-info mb-3"></i>
                                        <h5 class="card-title">Jersey-003</h5>
                                        <p class="text-muted">Raza: Jersey</p>
                                        <p class="text-muted">Edad: 4 años</p>
                                        <span class="badge bg-success mb-3">Saludable</span>
                                        <div class="d-grid gap-2">
                                            <button class="btn btn-outline-primary" onclick="verPerfilAnimal('Jersey-003')">
                                                <i class="fas fa-eye me-1"></i>Ver Perfil
                                            </button>
                                            <button class="btn btn-outline-warning" onclick="editarAnimal('Jersey-003')">
                                                <i class="fas fa-edit me-1"></i>Editar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Botón Agregar -->
                        <div class="text-center mt-4 mt-md-5">
                            <button class="btn btn-success btn-lg" onclick="agregarNuevoAnimal()">
                                <i class="fas fa-plus me-2"></i>Agregar Nuevo Animal
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/gestionar_animales.js"> </script>
</body>
</html>
