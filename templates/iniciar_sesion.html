<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - QR FARM</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-home me-2"></i>Inicio
            </a>
            <a class="navbar-brand mx-auto d-flex align-items-center" href="{{ url_for('index') }}">
                <span class="fw-bold fs-2">QR FARM</span>
                <i class="fas fa-cow ms-2 logo-icon"></i>
            </a>
            
            <div class="navbar-brand">
                <i class="fas fa-cow fa-2x"></i>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid vh-100 d-flex align-items-center" style="background-color: #f8f9fa;">
        <div class="row w-100 justify-content-center">
            <div class="col-lg-10">
                <div class="row bg-white rounded-4 shadow-lg overflow-hidden" style="min-height: 600px;">
                    <!-- Left Side - Image and Description -->
                    <div class="col-md-6 p-5 d-flex flex-column justify-content-center" style="background-color: #ffffff;">
                        <div class="text-center mb-4">
                            <img src="{{ url_for('static', filename='images/vacas-grupo.jpg') }}" alt="Grupo de vacas - QR Farm" class="img-fluid rounded-4 shadow" style="max-height: 350px; width: 100%; object-fit: cover; border: 3px solid #007bff;">
                        </div>
                        <div class="text-center">
                            <p class="text-muted mb-2">Tu aliado inteligente en la gestión ganadera.</p>
                            <p class="text-muted mb-2">Simplifica el control de tu ganado, mejora la trazabilidad</p>
                            <p class="text-muted mb-2">y optimiza tus procesos con tecnología QR.</p>
                            <p class="text-muted"><strong>¡Transforma tu finca hoy!</strong></p>
                        </div>
                    </div>

                    <!-- Right Side - Login Form -->
                    <div class="col-md-6 p-5 d-flex align-items-center" style="background-color: #6c757d;">
                        <div class="w-100">
                            <div class="text-center mb-4">
                                <i class="fas fa-user-circle fa-3x text-white mb-3"></i>
                                <h4 class="text-white fw-bold">Inicio de Sesión</h4>
                            </div>

                            <form id="loginForm" method="POST" action="{{ url_for('iniciar_sesion') }}">
                                {% if error %}
                                <div class="alert alert-danger text-center mt-2">{{ error }}</div>
                                {% endif %}
                                <div class="mb-3">
                                    <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Usuario" required>
                                </div>
                                <div class="mb-3">
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-success btn-lg fw-bold">Iniciar Sesión</button>
                                </div>
                                <div class="text-center mt-3">
                                    <p class="text-white">¿No tienes cuenta? <a href="{{ url_for('crear_cuenta') }}" class="text-info fw-bold">Crear cuenta</a></p>
                                </div>
                            </form>
</body>
</html>
