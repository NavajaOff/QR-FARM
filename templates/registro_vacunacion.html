<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Vacunación - QR FARM</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <i class="fas fa-user-circle fa-lg me-2"></i>
                <span class="fw-bold">Usuario</span>
            </div>
            
            <a class="navbar-brand mx-auto d-flex align-items-center" href="{{ url_for('menu') }}">
                <span class="fw-bold fs-2">QR FARM</span>
                <i class="fas fa-cow ms-2 logo-icon"></i>
            </a>
            
            <div class="navbar-brand">
                <i class="fas fa-syringe fa-2x"></i>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="{{ url_for('inventario') }}">
                    <i class="fas fa-boxes me-2"></i>Inventario
                </a>
                <a class="nav-link" href="{{ url_for('gestionar_animales') }}">
                    <i class="fas fa-cow me-2"></i>Gestionar animales
                </a>
                <a class="nav-link" href="{{ url_for('gestionar_potreros') }}">
                    <i class="fas fa-map-marked-alt me-2"></i>Gestionar potreros
                </a>
                <a class="nav-link" href="{{ url_for('escanear_qr') }}">
                    <i class="fas fa-qrcode me-2"></i>Escanear QR
                </a>
                <a class="nav-link active" href="{{ url_for('registro_vacunacion') }}">
                    <i class="fas fa-syringe me-2"></i>Registro Vacunación
                </a>
                <a class="nav-link" href="{{ url_for('iniciar_sesion') }}">
                    <i class="fas fa-sign-out-alt me-2"></i>Salir
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="container-fluid py-4 py-md-5">
                <div class="row justify-content-center g-4">
                    <div class="col-12">
                        <!-- Título y Botones de Acción -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="fw-bold text-dark mb-0">
                                <i class="fas fa-syringe me-2 text-success"></i>Registro de Vacunación
                            </h2>
                            <div class="d-flex gap-2">
                                <button class="btn btn-success" onclick="registrarVacunacion()">
                                    <i class="fas fa-plus me-2"></i>Nueva Vacunación
                                </button>
                                <button class="btn btn-primary" onclick="generarReporte()">
                                    <i class="fas fa-file-pdf me-2"></i>Generar Reporte
                                </button>
                            </div>
                        </div>

                        <!-- Filtros -->
                        <div class="card border-0 shadow-lg mb-4">
                            <div class="card-body p-3 p-sm-4">
                                <div class="row g-3">
                                    <div class="col-md-3">
                                        <label class="form-label">Buscar animal:</label>
                                        <input type="text" class="form-control" placeholder="ID o Nombre del animal">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Tipo de vacuna:</label>
                                        <select class="form-select">
                                            <option value="">Todas</option>
                                            <option>Brucelosis</option>
                                            <option>Fiebre Aftosa</option>
                                            <option>Tuberculosis</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Fecha desde:</label>
                                        <input type="date" class="form-control">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Fecha hasta:</label>
                                        <input type="date" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Tabla de Registros -->
                        <div class="card border-0 shadow-lg">
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover mb-0">
                                        <thead class="bg-light">
                                            <tr>
                                                <th>ID Animal</th>
                                                <th>Nombre/Código</th>
                                                <th>Tipo de Vacuna</th>
                                                <th>Fecha Aplicación</th>
                                                <th>Próxima Dosis</th>
                                                <th>Responsable</th>
                                                <th>Estado</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Los registros se cargarán dinámicamente -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/registro_vacunacion.js"></script>
</body>
</html>
